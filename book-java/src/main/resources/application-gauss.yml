spring:
  # 数据源连接信息一律通过环境变量提供，禁止在仓库内提交明文账号密码。
  # 示例（PowerShell）：
  #   $env:BOOK_DB_URL="jdbc:postgresql://<host>:<port>/book?currentSchema=book"
  #   $env:BOOK_DB_USERNAME="<user>"
  #   $env:BOOK_DB_PASSWORD="<password>"
  # 也可在 book-java/src/main/resources/application-local.yml 中配置（该文件已被 .gitignore 忽略）。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${BOOK_DB_URL:jdbc:postgresql://localhost:5432/book?currentSchema=book}
    username: ${BOOK_DB_USERNAME:postgres}
    password: ${BOOK_DB_PASSWORD:}
