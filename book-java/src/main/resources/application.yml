spring:
  # 设置文件上传大小
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # 404请求时抛出异常
  mvc:
    throw-exception-if-no-handler-found: true
  # 取消默认增加映射，如 /error
  resources:
    add-mappings: false
  # 激活哪个环境（本地数据库账号密码放在 application-local.yml）
  profiles:
    active: mysql,local
  # 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    timezone: GMT+8
server:
  port: 8088

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
# 日志级别
logging:
  level:
    com.bit.dbs.mapper: warn

book:
  backup:
    dir: ${BOOK_BACKUP_DIR:./backup}
    mysqldump: ${BOOK_MYSQLDUMP:mysqldump}
    mysql: ${BOOK_MYSQL:mysql}
    # 可选：仅用于恢复的账号。MySQL 开启 binlog 时，恢复触发器需要 SUPER 权限。
    restore-username: ${BOOK_BACKUP_RESTORE_USER:}
    restore-password: ${BOOK_BACKUP_RESTORE_PASSWORD:}
